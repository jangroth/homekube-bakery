name: images

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 5'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-24.04-arm
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: images
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          images=$(.github/scripts/changed-images.sh "$GITHUB_EVENT_NAME" "$BEFORE" "$GITHUB_REF")
          echo "images=$images" >> "$GITHUB_OUTPUT"

  scripts:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y bats shellcheck
      - run: bats .github/scripts/tests
      - run: ./lint.sh

  test:
    needs: changes
    if: needs.changes.outputs.images != '[]' && github.ref != 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y bats
      - run: ./test.sh ${{ matrix.image }}

  publish:
    needs: [changes, scripts]
    if: needs.changes.outputs.images != '[]' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: publish-${{ matrix.image }}
    permissions:
      contents: write
      packages: write
    env:
      REPOSITORY: ${{ github.repository }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y bats
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<<"$GITHUB_TOKEN"
      - name: Build and push untagged, by digest
        id: build
        run: |
          docker buildx create --use --driver docker-container
          docker buildx build --platform linux/arm64 \
            --attest type=sbom --attest type=provenance,mode=max \
            --output "type=image,name=ghcr.io/$REPOSITORY,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file metadata.json "images/${{ matrix.image }}"
          digest=$(jq -er '."containerimage.digest"' metadata.json)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Run the contract tests against the pushed digest
        run: ./test.sh ${{ matrix.image }} "ghcr.io/$REPOSITORY@${{ steps.build.outputs.digest }}"
      - name: Compare the manifest with the last release
        id: manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          .github/scripts/manifest.sh "images/${{ matrix.image }}/Dockerfile" "ghcr.io/$REPOSITORY@$DIGEST" >manifest.txt
          last_release_tag=$(.github/scripts/last-release-tag.sh "${{ matrix.image }}")
          published=$(.github/scripts/published-tags.sh "$REPOSITORY")
          last_published=$(grep -xE '[0-9]+\.[0-9]+\.[0-9]+' <<<"$published" | sort -V | tail -n1 || true)
          if [ "${last_release_tag#*/}" != "$last_published" ]; then
            echo "::error::GHCR's highest ${{ matrix.image }} tag is '$last_published', but its last release git tag is '$last_release_tag'."
            exit 1
          fi
          if [ -z "$last_release_tag" ]; then
            echo "Initial release." >changes.md
          else
            git show "$last_release_tag:images/${{ matrix.image }}/Dockerfile" >last.Dockerfile
            .github/scripts/manifest.sh last.Dockerfile "ghcr.io/$REPOSITORY:${last_release_tag#*/}" >last-manifest.txt
            .github/scripts/manifest-diff.sh last-manifest.txt manifest.txt >changes.md
            if [ "$GITHUB_EVENT_NAME" = schedule ] && ! [ -s changes.md ]; then
              echo "::notice::${{ matrix.image }}: manifest unchanged since $last_release_tag, nothing to publish."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            commits=$(git log --format='- %h %s' "$last_release_tag..HEAD" -- "images/${{ matrix.image }}" test test.sh)
            if [ -n "$commits" ]; then
              if [ -s changes.md ]; then echo >>changes.md; fi
              printf '### Commits\n\n%s\n' "$commits" >>changes.md
            fi
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Compute the tag
        if: steps.manifest.outputs.publish == 'true'
        id: tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          major_minor=$(tr -d '[:space:]' <"images/${{ matrix.image }}/VERSION")
          tag=$(.github/scripts/published-tags.sh "$REPOSITORY" | .github/scripts/next-tag.sh "$major_minor")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Tag the tested digest
        if: steps.manifest.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          tags=$(.github/scripts/published-tags.sh "$REPOSITORY")
          if grep -qFx "$TAG" <<<"$tags"; then
            echo "::error::$REPOSITORY:$TAG is already published; tags are immutable."
            exit 1
          fi
          docker buildx imagetools create -t "ghcr.io/$REPOSITORY:$TAG" "ghcr.io/$REPOSITORY@$DIGEST"
          tagged=$(docker buildx imagetools inspect "ghcr.io/$REPOSITORY:$TAG" --format '{{json .Manifest}}' | jq -er .digest)
          if [ "$tagged" != "$DIGEST" ]; then
            echo "::error::$REPOSITORY:$TAG points at $tagged, not the tested $DIGEST."
            exit 1
          fi
      - name: Check the tag pulls anonymously
        if: steps.manifest.outputs.publish == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if ! DOCKER_CONFIG="$(mktemp -d)" docker pull "ghcr.io/$REPOSITORY:$TAG"; then
            echo "::error::ghcr.io/$REPOSITORY:$TAG can't be pulled anonymously. On an image's first publish its GHCR package may start private: the operator makes it public in the GHCR web UI (package settings, Change visibility), which can't be undone."
            exit 1
          fi
      - name: Create the git tag and GitHub Release
        if: steps.manifest.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          printf '%s\n\n' "\`ghcr.io/$REPOSITORY:$TAG@$DIGEST\`, built from $GITHUB_SHA." | cat - changes.md >notes.md
          gh release create "${{ matrix.image }}/$TAG" manifest.txt --target "$GITHUB_SHA" --latest=false \
            --title "${{ matrix.image }} $TAG" --notes-file notes.md
